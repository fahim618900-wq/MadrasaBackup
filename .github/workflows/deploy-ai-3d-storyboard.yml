name: Deploy AI 3D Storyboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "ai-3d-storyboard/**"
      - ".github/workflows/deploy-ai-3d-storyboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ai-3d-storyboard
        run: npm install

      - name: Build static app
        working-directory: ai-3d-storyboard
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/ai-3d-storyboard
          cp -R ai-3d-storyboard/dist/. _site/ai-3d-storyboard/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
